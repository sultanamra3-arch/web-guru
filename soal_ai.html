<main>
<div class="judul-baris"><h1>✨ Buat soal dengan AI</h1><span><a class="tombol" href="soal.html">‹ Bank soal</a></span></div><form class="formulir" id="form-soal-ai" data-token="5cd6959655137c2255ac21406009a543">
  <fieldset><legend>Permintaan</legend>
    <div class="baris2">
      <label>Mata pelajaran<input name="mapel" list="dl-mapel" required value="Informatika"></label>
      <label>Kelas<select name="kelas"><option value="Kelas 7">Kelas 7</option><option value="Kelas 8">Kelas 8</option><option value="Kelas 9">Kelas 9</option></select></label>
    </div>
    <label>Materi / topik<input name="topik" required placeholder="mis. Sistem pencernaan manusia"></label>
    <div class="baris3">
      <label>Jumlah<input type="number" name="jumlah" min="1" max="30" value="10"></label>
      <label>Bentuk<select name="tipe"><option value="pg" selected>Pilihan ganda</option><option value="campur">Campuran</option><option value="esai">Uraian</option><option value="isian">Isian singkat</option><option value="bs">Benar/Salah</option></select></label>
      <label>Opsi PG<select name="jumlah_opsi"><option value="A–D">A–D</option><option value="A–E">A–E</option></select></label>
    </div>
    <label>Tingkat<select name="tingkat"><option value="campuran (LOTS, MOTS, HOTS seimbang)" selected>Campuran (disarankan)</option><option value="mudah (LOTS)">Mudah</option><option value="sedang (MOTS)">Sedang</option><option value="sulit (HOTS, berbasis kasus/stimulus)">Sulit / HOTS</option></select></label>
    <details><summary class="kecil">Tambahan (opsional): bahan materi, foto buku, catatan</summary>
      <label>Tempel teks materi <small>(soal dibuat dari teks ini)</small><textarea name="bahan" rows="4"></textarea></label>
      <div class="dua-tombol">
        <label class="tombol">📷 Kamera<input type="file" class="ambil-foto" accept="image/*" capture="environment" hidden></label>
        <label class="tombol">🖼 Galeri<input type="file" class="ambil-foto" accept="image/*" multiple hidden></label>
      </div>
      <div class="pratinjau-foto kiri"></div>
      <label>Catatan untuk AI<input name="catatan" placeholder="mis. gunakan konteks perkebunan kelapa"></label>
    </details>
  </fieldset>
  <button class="utama lebar" id="tombol-buat-soal">✨ Buat soal</button>
  <div id="status-ai" class="kecil"></div>
</form>

<form method="post" id="hasil-soal" hidden>
  <input type="hidden" name="_t" value="5cd6959655137c2255ac21406009a543">  <input type="hidden" name="data"><input type="hidden" name="mapel"><input type="hidden" name="kelas_angka"><input type="hidden" name="topik">
  <div class="kartu lengket aksi-bank">
    <label class="centang"><input type="checkbox" id="pilih-semua-hasil" checked> Pilih semua</label>
    <span><label class="centang kecil"><input type="checkbox" name="berbagi" value="1"> Bagikan</label> <button class="utama kecil">💾 Simpan ke bank soal</button></span>
  </div>
  <ol class="daftar kartu bank-soal" id="daftar-hasil"></ol>
</form>
<datalist id="dl-mapel"><option value="Informatika"></datalist>
