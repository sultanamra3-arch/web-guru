plugins {
    id 'com.android.application'
}

android {
    namespace 'id.my.otomasismpn6keritang.siguruadmin'
    compileSdk 35

    defaultConfig {
        applicationId 'id.my.otomasismpn6keritang.siguruadmin'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.4'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
